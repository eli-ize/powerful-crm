name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
      - master
      - deploy-clean
  workflow_dispatch:

env:
  AZURE_CONTAINER_APP_NAME: powerful-crm
  AZURE_RESOURCE_GROUP: powerful-crm-rg
  AZURE_LOCATION: eastus
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: � Checkout code
      uses: actions/checkout@v4

    - name: 🐳 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🏗️ Build and push container image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:${{ github.sha }}
          ghcr.io/${{ github.repository }}:latest

    - name: � Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 🚀 Deploy to Azure Container Apps
      run: |
        az containerapp update \
          --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --image ghcr.io/${{ github.repository }}:${{ github.sha }} \
          --set-env-vars \
            NODE_ENV=production \
            PORT=8000 \
            BACKEND_URL=${{ secrets.BACKEND_URL }} \
            TELNYX_API_KEY=${{ secrets.TELNYX_API_KEY }} \
            TELNYX_PUBLIC_KEY=${{ secrets.TELNYX_PUBLIC_KEY }} \
            TELNYX_CONNECTION_ID=${{ secrets.TELNYX_CONNECTION_ID }} \
            JWT_SECRET=${{ secrets.JWT_SECRET }} \
            DATABASE_URL=${{ secrets.DATABASE_URL }}

    - name: ✅ Deployment Summary
      run: |
        echo "🎉 Deployment completed successfully!"
        echo "📦 Image: ghcr.io/${{ github.repository }}:${{ github.sha }}"
        echo "🌐 App URL: https://${{ env.AZURE_CONTAINER_APP_NAME }}.azurecontainerapps.io"
