sonar.exclusions=\
  **/.github/workflows/*.yml,\
  **/.github/workflows/*.yaml,\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**

sonar.issue.ignore.multicriteria=e1,e2,e3,e4

# Ignore GitHub Actions secret warnings
sonar.issue.ignore.multicriteria.e1.ruleKey=github-actions:S6277
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.yml

# Ignore secret detection in workflows
sonar.issue.ignore.multicriteria.e2.ruleKey=secrets:S6290
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.yml

# Ignore useless assignments
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S1854
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.tsx

# Ignore JavaScript useless assignments
sonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S1854
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.tsx
